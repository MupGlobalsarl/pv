s=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3214em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">10</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">15</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.686em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">5</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">m³/h par m</span></span></span></span></span></span></div><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Contrôle</th>\n<th>Calcul</th>\n<th>Résultat</th>\n<th>Seuil</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Rabattement au débit de pointe</td>\n<td>Qp / qs = 14,7 / 1,5</td>\n<td>9,8 m</td>\n<td>≤ 15 m (rabattement max)</td>\n</tr>\n<tr>\n<td>Niveau dynamique à Qp</td>\n<td>NS + 9,8</td>\n<td>34,8 m</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Immersion de la pompe</td>\n<td>41 − 34,8</td>\n<td>6,2 m</td>\n<td>≥ 3 m</td>\n</tr>\n<tr>\n<td>Garde au fond du forage</td>\n<td>56 − 41</td>\n<td>15 m</td>\n<td>≥ 3 m</td>\n</tr>\n</tbody></table></div>\n<p>Tout est OK : la synthèse affiche « OK ». Si l&#39;un des contrôles est rouge, on agit dans cet ordre : descendre la pompe (si la garde au fond le permet), réduire le débit de pointe (goutte-à-goutte, surface plus petite), ou faire un second forage.</p>\n<p><strong>Remarque :</strong> le calcul du rabattement est linéaire (débit spécifique constant). Il n&#39;est valable que pour un débit inférieur ou égal au débit d&#39;essai. Au-delà, le rabattement réel augmente plus vite.</p>\n" }, { "t": "Chapitre 8 – Le bassin de rétention et le surpresseur", "h": "<p>Le bassin stocke l&#39;eau pompée au soleil pour irriguer à l&#39;heure voulue et couvrir les jours gris ; le surpresseur reprend l&#39;eau du bassin pour donner la pression aux asperseurs.</p>\n<h3>8.1 Le volume utile</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3117em;\"><span style=\"top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0359em;\">q</span><span class=\"mord mathnormal mtight\">u</span><span class=\"mord mathnormal mtight\">i</span><span class=\"mord mathnormal mtight\">s</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3117em;\"><span style=\"top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">p</span><span class=\"mord mathnormal mtight\">o</span><span class=\"mord mathnormal mtight\">in</span><span class=\"mord mathnormal mtight\">t</span><span class=\"mord mathnormal mtight\">e</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6595em;\"></span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">mi</span><span class=\"mord mathnormal\">e</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">80</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">56</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">80</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">56</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">m³</span></span></span></span></span></span></div><p>Une autonomie de 1 jour suffit en général en saison sèche à Lubumbashi (ciel dégagé). Pour des cultures très sensibles, on peut prendre 2 jours, mais le coût de terrassement et de géomembrane double presque.</p>\n<h3>8.2 La forme du bassin</h3>\n<p>Le programme dessine un bassin <strong>carré en déblai</strong>, en forme de tronc de pyramide renversé, avec talus revêtus de géomembrane PEHD.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Donnée</th>\n<th>Défaut</th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Profondeur d&#39;eau utile hu</td>\n<td>2 m</td>\n<td>Entre la tranche morte et le trop-plein (1,5 à 3 m)</td>\n</tr>\n<tr>\n<td>Tranche morte</td>\n<td>0,3 m</td>\n<td>Protège la crépine des dépôts du fond</td>\n</tr>\n<tr>\n<td>Revanche</td>\n<td>0,4 m</td>\n<td>Sécurité au-dessus du trop-plein</td>\n</tr>\n<tr>\n<td>Fruit des talus m</td>\n<td>1,5</td>\n<td>1 m de haut pour 1,5 m d&#39;horizontal</td>\n</tr>\n<tr>\n<td>Tranchée d&#39;ancrage</td>\n<td>1 m</td>\n<td>Bande de géomembrane au-delà de la crête</td>\n</tr>\n<tr>\n<td>Majoration géomembrane</td>\n<td>10 %</td>\n<td>Soudures et chutes</td>\n</tr>\n</tbody></table></div>\n<p>Hauteur totale = 2 + 0,3 + 0,4 = <strong>2,7 m</strong>.</p>\n<h3>8.3 Le calcul du côté au fond</h3>\n<p>Pour un tronc de pyramide à base carrée de côté b et de fruit m, le volume jusqu&#39;à la hauteur z vaut :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\" style=\"margin-right:0.044em;\">z</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9474em;vertical-align:-0.0833em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\">b</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span></span></span></span></span><span class=\"mord mathnormal\" style=\"margin-right:0.044em;\">z</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9474em;vertical-align:-0.0833em;\"></span><span class=\"mord\">2</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\">b</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\">m</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.044em;\">z</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.0074em;vertical-align:-0.686em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3214em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">3</span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\">4</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.686em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\">m</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span></span></span></span></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.044em;\">z</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">3</span></span></span></span></span></span></span></span></span></span></span></span></div><p>Le volume utile est la différence entre V(tranche morte + hu) et V(tranche morte). C&#39;est une équation du second degré en b ; le programme la résout et trouve b = 2,21 m, arrondi à <strong>2,5 m</strong> (au 0,5 m supérieur ; minimum 2 m pour le passage des engins).</p>\n<h3>8.4 Les dimensions obtenues</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Résultat</th>\n<th>Formule</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Côté en crête</td>\n<td>b + 2·m·H</td>\n<td>10,6 m</td>\n</tr>\n<tr>\n<td>Côté du plan d&#39;eau (trop-plein)</td>\n<td>b + 2·m·(tranche morte + hu)</td>\n<td>9,4 m</td>\n</tr>\n<tr>\n<td>Volume utile réel</td>\n<td>V(2,3) − V(0,3)</td>\n<td>87,9 m³ (≥ 80,6 : OK)</td>\n</tr>\n<tr>\n<td>Volume de déblai</td>\n<td>V(2,7)</td>\n<td>130,6 m³</td>\n</tr>\n<tr>\n<td>Longueur d&#39;un talus</td>\n<td>H·√(1 + m²)</td>\n<td>4,87 m</td>\n</tr>\n<tr>\n<td>Géomembrane</td>\n<td>[b² + 2(b + A)·rampant + 4·A·ancrage] × 1,1</td>\n<td>193,8 m²</td>\n</tr>\n<tr>\n<td>Emprise au sol (avec chemin de ronde 1 m)</td>\n<td>(A + 2·ancrage + 2)²</td>\n<td>213 m²</td>\n</tr>\n<tr>\n<td>Clôture</td>\n<td>4 × (A + 2·ancrage + 2)</td>\n<td>58,4 m</td>\n</tr>\n</tbody></table></div>\n<p>(A = côté en crête.)</p>\n<h3>8.5 Évaporation et remplissage</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><spa ss=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">o</span><span class=\"mpunct mtight\">,</span><span class=\"mord mathnormal mtight\">ma</span><span class=\"mord mathnormal mtight\">x</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">1/1</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\">000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1.0585em;vertical-align:-0.1944em;\"></span><span class=\"mord\">9</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\"><span class=\"mord\">4</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8641em;\"><span style=\"top:-3.113em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">6</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">3</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">1/1</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\">000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">0</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">61</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">m³/j</span></span></span></span></span></span></div><p>Soit 0,8 % du besoin de pointe. Au-delà de 5 %, il faut un bassin plus profond (moins de surface) ou une couverture. Le remplissage complet par la pompe du forage prend 87,9 / 80,6 = <strong>1,1 jour de soleil</strong>.</p>\n<h3>8.6 Le surpresseur solaire</h3>\n<p>Le surpresseur est une pompe de surface qui aspire dans le bassin et refoule dans le réseau d&#39;aspersion. Il est calculé exactement comme la pompe du forage (chapitres 4 à 6), avec ses propres données :</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Étape</th>\n<th>Calcul</th>\n<th>Résultat</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Débit de pointe</td>\n<td>même que la pompe du forage</td>\n<td>14,7 m³/h</td>\n</tr>\n<tr>\n<td>Pertes linéaires</td>\n<td>Hazen-Williams sur conduite + 10 m (DN75, 160 m)</td>\n<td>3,82 m</td>\n</tr>\n<tr>\n<td>Pertes singulières</td>\n<td>15 %</td>\n<td>0,57 m</td>\n</tr>\n<tr>\n<td>Pression aux asperseurs</td>\n<td>2,5 bar × 10,2</td>\n<td>25,5 m</td>\n</tr>\n<tr>\n<td>Hauteur géométrique</td>\n<td>aspiration 2 m + dénivelé 3 m</td>\n<td>5 m</td>\n</tr>\n<tr>\n<td><strong>HMT</strong></td>\n<td>somme</td>\n<td><strong>34,9 m</strong></td>\n</tr>\n<tr>\n<td>Puissance hydraulique</td>\n<td>2,725 × 14,7 × 34,9</td>\n<td>1 398 W</td>\n</tr>\n<tr>\n<td>Puissance absorbée</td>\n<td>/ 0,55</td>\n<td>2 541 W</td>\n</tr>\n<tr>\n<td>Moteur</td>\n<td>2 541 × 0,85 = 2 160 W</td>\n<td>2,2 kW mono 230 V</td>\n</tr>\n<tr>\n<td>Énergie électrique</td>\n<td>2,725 × 80,6 × 34,9 / (0,55 × 0,95)</td>\n<td>14,66 kWh/j</td>\n</tr>\n<tr>\n<td>Champ PV</td>\n<td>max(2 943 ; 2 860) Wc</td>\n<td>6 modules = 3 300 Wc</td>\n</tr>\n</tbody></table></div>\n<p>Le surpresseur est protégé par un <strong>pressostat</strong> et un <strong>flotteur de niveau bas</strong> dans le bassin (pas de marche à sec). La hauteur d&#39;aspiration doit rester inférieure à 6 m ; l&#39;idéal est une pompe <strong>en charge</strong> (posée plus bas que le fond du bassin).</p>\n<h3>8.7 Conseils de réalisation</h3>\n<ul>\n<li>Implanter le bassin sur un point haut de la parcelle : on gagne du dénivelé pour l&#39;irrigation.</li>\n<li>Compacter le fond et les talus, retirer pierres et racines, poser un géotextile sous la géomembrane.</li>\n<li>Prévoir un trop-plein bien dimensionné et une clôture : un bassin revêtu est glissant et dangereux pour les enfants et le bétail.</li>\n</ul>\n" }, { "t": "Chapitre 9 – Cultures, devis et plan d'affaires", "h": "<p>La partie économique répond à la question du client : « Combien cela coûte, combien cela rapporte, et en combien de temps je récupère mon argent ? »</p>\n<h3>9.1 La feuille Cultures (assolement)</h3>\n<p>Le technicien répartit la surface entre les cultures. Pour chaque culture, le programme calcule :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\">c</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">n</span><span class=\"mspace\"> </span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">ab</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\">e</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em; ></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord text\"><span class=\"mord\">cycles</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord text\"><span class=\"mord\">co</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">u</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">ˆ</span></span></span></span></span></span></span><span class=\"mord\">t par ha et par cycle</span></span></span></span></span></span></div><p>Exemple par défaut (1 ha, prix indicatifs Haut-Katanga) :</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Culture</th>\n<th>Part</th>\n<th>Cycles/an</th>\n<th>Rendement (t/ha/cycle)</th>\n<th>Pertes</th>\n<th>Prix (USD/kg)</th>\n<th>CA (USD/an)</th>\n<th>Marge brute (USD/an)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Tomate</td>\n<td>30 %</td>\n<td>2</td>\n<td>25</td>\n<td>15 %</td>\n<td>0,80</td>\n<td>10 200</td>\n<td>8 700</td>\n</tr>\n<tr>\n<td>Chou pommé</td>\n<td>20 %</td>\n<td>2</td>\n<td>30</td>\n<td>10 %</td>\n<td>0,40</td>\n<td>4 320</td>\n<td>3 720</td>\n</tr>\n<tr>\n<td>Légumes-feuilles</td>\n<td>15 %</td>\n<td>6</td>\n<td>10</td>\n<td>15 %</td>\n<td>0,60</td>\n<td>4 590</td>\n<td>4 050</td>\n</tr>\n<tr>\n<td>Oignon</td>\n<td>20 %</td>\n<td>1,5</td>\n<td>25</td>\n<td>10 %</td>\n<td>0,90</td>\n<td>6 075</td>\n<td>5 475</td>\n</tr>\n<tr>\n<td>Piment / poivron</td>\n<td>15 %</td>\n<td>2</td>\n<td>12</td>\n<td>15 %</td>\n<td>1,50</td>\n<td>4 590</td>\n<td>3 990</td>\n</tr>\n<tr>\n<td><strong>Total</strong></td>\n<td><strong>100 %</strong></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td><strong>29 775</strong></td>\n<td><strong>25 935</strong></td>\n</tr>\n</tbody></table></div>\n<p>La somme des parts doit faire 100 %, sinon le programme affiche une alerte. <strong>Ces rendements et prix sont des hypothèses</strong> : le technicien doit les confirmer avec l&#39;exploitant et le marché local avant de présenter le plan d&#39;affaires.</p>\n<h3>9.2 Le devis</h3>\n<p>Les quantités du devis viennent directement des calculs techniques : profondeur du forage (56 m), puissance de la pompe (3 kW), nombre de modules (8 + 6), longueurs de câbles et de conduites, déblai et géomembrane du bassin. Seuls les <strong>prix unitaires</strong> sont à mettre à jour selon les fournisseurs du moment.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Lot</th>\n<th>Montant (USD)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1. Forage et équipement de tête</td>\n<td>4 060</td>\n</tr>\n<tr>\n<td>2. Pompage solaire</td>\n<td>2 792</td>\n</tr>\n<tr>\n<td>3. Champ photovoltaïque</td>\n<td>1 802</td>\n</tr>\n<tr>\n<td>4. Réseau et irrigation</td>\n<td>3 549</td>\n</tr>\n<tr>\n<td>5. Protections et terre</td>\n<td>410</td>\n</tr>\n<tr>\n<td>6. Aménagements de l&#39;exploitation</td>\n<td>6 300</td>\n</tr>\n<tr>\n<td>7. Bassin de rétention et surpresseur</td>\n<td>5 876</td>\n</tr>\n<tr>\n<td><strong>Total matériel</strong></td>\n<td><strong>24 789</strong></td>\n</tr>\n<tr>\n<td>Main-d&#39;œuvre (15 %), transport (5 %), imprévus (5 %)</td>\n<td>6 197</td>\n</tr>\n<tr>\n<td><strong>Total HT</strong></td>\n<td><strong>30 986</strong></td>\n</tr>\n<tr>\n<td>TVA 16 %</td>\n<td>4 958</td>\n</tr>\n<tr>\n<td><strong>Total TTC</strong></td>\n<td><strong>35 944</strong></td>\n</tr>\n<tr>\n<td>dont investissement « eau » (lots 1, 2, 3, 5 et 7, TTC)</td>\n<td>21 663</td>\n</tr>\n</tbody></table></div>\n<p>Quelques règles de quantité à connaître : le câble immergé = longueur du câble moteur + 6 m de marge (57 m) ; le câble solaire = 2 × (distance PV ↔ variateur) + câblage du champ ; la conduite principale = longueur + 5 % (158 m).</p>\n<h3>9.3 Le plan d&#39;affaires</h3>\n<p>Le plan d&#39;affaires construit un compte de résultat et un tableau de trésorerie sur 10 ans.</p>\n<p><strong>Hypothèses par défaut :</strong> actualisation 12 % ; inflation des prix 3 % et des coûts 4 % ; activité 70 % en année 1 et 90 % en année 2 ; 4 ouvriers à 150 USD/mois ; charges fixes 2 400 USD/an ; entretien 1,5 % de l&#39;investissement eau ; assurance 1 % de l&#39;investissement total ; remplacement des pompes et variateurs en année 8 ; amortissement sur 10 ans ; impôt 30 % ; apport personnel 30 % ; emprunt à 12 % sur 5 ans.</p>\n<p><strong>Financement :</strong> besoin total = 35 944 + fonds de roulement 3 360 = 39 304 USD ; apport 11 791 ; emprunt 27 513 ; annuité 7 632 USD/an.</p>\n<p>Pour chaque année, le programme calcule :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mord mathnormal\" style=\"margin-right:0.0502em;\">B</span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C</span><span class=\"mord mathnorma ss=\"mord\">%</span><span class=\"mclose\">)</span></span></span></span></span></div><div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord text\"><span class=\"mord\">DSCR</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.2519em;vertical-align:-0.8804em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3714em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord\">int</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">e</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">ˊ</span></span></span></span></span></span></span><span class=\"mord\">r</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">e</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">ˆ</span></span></span></span></span></span></span><span class=\"mord\">ts</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord text\"><span class=\"mord\">remboursement du capital</span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord\">EBE</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">−</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord text\"><span class=\"mord\">imp</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\">o</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">ˆ</span></span></span></span></span></span></span><span class=\"mord\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8804em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span></span></span></span></span></div><h3>9.4 Les indicateurs</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Indicateur</th>\n<th>Valeur</th>\n<th>Lecture</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>VAN (10 ans, 12 %)</td>\n<td>26 997 USD</td>\n<td>&gt; 0 : projet rentable</td>\n</tr>\n<tr>\n<td>TRI</td>\n<td>25 %</td>\n<td>&gt; 12 % : rentable</td>\n</tr>\n<tr>\n<td>Délai de récupération</td>\n<td>3,8 ans</td>\n<td></td>\n</tr>\n<tr>\n<td>CA en année 3</td>\n<td>31 588 USD</td>\n<td></td>\n</tr>\n<tr>\n<td>Résultat net année 3</td>\n<td>7 362 USD (marge 23 %)</td>\n<td></td>\n</tr>\n<tr>\n<td>DSCR minimal</td>\n<td>0,99</td>\n<td><strong>&lt; 1,2 : couverture de la dette insuffisante en année 1</strong></td>\n</tr>\n<tr>\n<td>Coût complet de l&#39;eau pompée</td>\n<td>0,27 USD/m³</td>\n<td></td>\n</tr>\n</tbody></table></div>\n<p><strong>Que faire quand le DSCR est insuffisant ?</strong> C&#39;est la montantée en charge de l&#39;année 1 (70 % d&#39;activité) qui fait baisser le DSCR. On peut proposer à la banque un <strong>différé de remboursement</strong> d&#39;un an, allonger la durée de l&#39;emprunt, augmenter l&#39;apport, ou réduire les aménagements de l&#39;année 1 (magasin, clôture).</p>\n<h3>9.5 La comparaison avec un pompage diesel</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Poste</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Énergie hydraulique annuelle (forage + surpresseur)</td>\n<td>2 629 kWh</td>\n</tr>\n<tr>\n<td>Gasoil équivalent (0,8 L/kWh)</td>\n<td>2 103 L/an</td>\n</tr>\n<tr>\n<td>Coût annuel diesel (carburant + entretien + renouvellement du groupe)</td>\n<td>4 396 USD/an</td>\n</tr>\n<tr>\n<td>Coût annuel solaire (entretien + remplacements)</td>\n<td>572 USD/an</td>\n</tr>\n<tr>\n<td><strong>Économie annuelle</strong></td>\n<td><strong>3 823 USD/an</strong></td>\n</tr>\n<tr>\n<td>Surcoût d&#39;investissement solaire</td>\n<td>18 663 USD</td>\n</tr>\n<tr>\n<td>Retour sur le surcoût</td>\n<td>4,9 ans</td>\n</tr>\n<tr>\n<td>CO₂ évité (2,68 kg/L)</td>\n<td>5,6 t/an</td>\n</tr>\n</tbody></table></div>\n<h3>9.6 La sensibilité</h3>\n<p>Le programme montre ce que devient la VAN si les recettes baissent (prix ou rendements) : −10 % → 16 253 USD ; −20 % → 5 509 USD ; −30 % → <strong>−5 235 USD</strong>. Message à donner au client : le projet supporte une baisse de recettes d&#39;environ 25 %. Au-delà, il faut revoir l&#39;assolement ou les débouchés.</p>\n" }, { "t": "Chapitre 10 – Exploitation et maintenance", "h": "<p>Une station de pompage solaire bien entretenue dure plus de 20 ans pour les modules et 8 à 10 ans pour la pompe et le variateur ; la feuille « Exploitation et maintenance » donne au technicien les fiches pour y arriver.</p>\n<h3>10.1 La fiche d&#39;identité de la station</h3>\n<p>Elle reprend automatiquement les résultats du dimensionnement : profondeur du forage, niveaux statique et dynamique, modèle de pompe, point de fonctionnement, champ PV, câbles, protections, bassin. Le technicien y ajoute la date de mise en service et les numéros de série. <strong>Elle doit être plastifiée et affichée dans l&#39;abri du variateur.</strong></p>\n<h3>10.2 Les valeurs de référence</h3>\n<p>Ce sont les valeurs qu&#39;on doit mesurer sur une installation saine. Toute mesure de terrain se compare à ces chiffres.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Grandeur</th>\n<th>Valeur attendue (exemple)</th>\n<th>Si l&#39;écart est important</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Débit à midi solaire, beau temps</td>\n<td>14,7 m³/h</td>\n<td>&gt; 20 % de moins : modules sales ou ombrés, pompe usée, fuite</td>\n</tr>\n<tr>\n<td>Volume journalier (octobre)</td>\n<td>80,6 m³/j</td>\n<td>Comparer au compteur d&#39;eau</td>\n</tr>\n<tr>\n<td>Pression en tête de forage</td>\n<td>0,51 bar</td>\n<td>Beaucoup plus : vanne fermée ou conduite bouchée</td>\n</tr>\n<tr>\n<td>Niveau statique (le matin, pompe arrêtée)</td>\n<td>25 m</td>\n<td>Baisse d&#39;année en année : baisse de la nappe</td>\n</tr>\n<tr>\n<td>Rabattement au débit de pointe</td>\n<td>9,8 m</td>\n<td>Augmente avec le temps : forage qui se colmate</td>\n</tr>\n<tr>\n<td>Voc d&#39;une chaîne (≈ 25 °C)</td>\n<td>396,8 V (8 × 49,6)</td>\n<td>Écart &gt; 5 % entre chaînes : module, MC4 ou diode défectueux</td>\n</tr>\n<tr>\n<td>Voc max par temps froid</td>\n<td>418,2 V</td>\n<td>Doit rester sous 450 V</td>\n</tr>\n<tr>\n<td>Vmp à chaud</td>\n<td>292,7 V</td>\n<td>Doit rester au-dessus de 200 V</td>\n</tr>\n<tr>\n<td>Isc d&#39;une chaîne (1 000 W/m²)</td>\n<td>14 A</td>\n<td>Environ moitié à 500 W/m²</td>\n</tr>\n<tr>\n<td>Courant moteur</td>\n<td>18,7 A</td>\n<td>Plus élevé : pompe freinée (sable) ou tension basse</td>\n</tr>\n<tr>\n<td>Prise de terre</td>\n<td>≤ 10 Ω</td>\n<td>Améliorer la terre</td>\n</tr>\n</tbody></table></div>\n<h3>10.3 Le plan de maintenance préventive</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tâche</th>\n<th>Fréquence</th>\n<th>Qui</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Relever le compteur d&#39;eau, les heures de pompage, le niveau du bassin</td>\n<td>Chaque jour</td>\n<td>Fontainier</td>\n</tr>\n<tr>\n<td>Nettoyer les filtres d&#39;irrigation</td>\n<td>Chaque semaine</td>\n<td>Exploitant</td>\n</tr>\n<tr>\n<td>Nettoyer les modules à l&#39;eau claire, tôt le matin, sans détergent</td>\n<td>Toutes les 2 semaines en saison sèche, mensuel sinon</td>\n<td>Gardien</td>\n</tr>\n<tr>\n<td>Vérifier ombrage et clôture ; lire l&#39;écran du variateur ; tester la sonde et le flotteur</td>\n<td>Chaque mois</td>\n<td>Gardien / technicien local</td>\n</tr>\n<tr>\n<td>Serrage des bornes, MC4, câbles ; parafoudres et fusibles ; niveaux statique et dynamique</td>\n<td>Chaque trimestre (et après chaque orage violent pour les parafoudres)</td>\n<td>Technicien</td>\n</tr>\n<tr>\n<td>Débit et pression à midi ; inspection du bassin</td>\n<td>Chaque semestre</td>\n<td>Technicien / exploitant</td>\n</tr>\n<tr>\n<td>Terre, isolement du moteur (mégohmmètre 500 V), Voc et Isc de chaque chaîne</td>\n<td>Chaque année</td>\n<td>Électricien qualifié</td>\n</tr>\n<tr>\n<td>Remonter et inspecter la pompe</td>\n<td>Si le débit baisse de plus de 20 % malgré un champ propre</td>\n<td>Technicien spécialisé</td>\n</tr>\n<tr>\n<td>Remplacer pompes et variateurs</td>\n<td>Année 8 (budget ≈ 3 260 USD de matériel)</td>\n<td>MUPGLOBAL SARL</td>\n</tr>\n</tbody></table></div>\n<h3>10.4 La fiche de visite et les relevés journaliers</h3>\n<p>À chaque visite, le technicien remplit la fiche : valeur de référence, valeur mesurée, conforme oui / non, actions. Le fontainier remplit chaque jour le tableau mensuel (index du compteur, volume, heures, niveau du bassin, météo, pannes). Ces relevés sont la meilleure preuve de bon fonctionnement et permettent de détecter une dérive avant la panne.</p>\n<h3>10.5 Le guide de dépannage rapide</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Symptôme</th>\n<th>Causes probables</th>\n<th>Actions</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>La pompe ne démarre pas par beau temps</td>\n<td>Sectionneur DC ouvert, fusible fondu, défaut variateur, sonde de niveau</td>\n<td>Lire le code défaut ; mesurer la tension DC à l&#39;entrée ; tester la sonde</td>\n</tr>\n<tr>\n<td>Débit faible</td>\n<td>Modules sales ou ombrés, rabattement excessif, crépine colmatée, fuite</td>\n<td>Nettoyer ; mesurer le niveau dynamique ; comparer débit, pression, courant</td>\n</tr>\n<tr>\n<td>Arrêts fréquents</td>\n<td>Marche à sec, surchauffe du variateur, nuages</td>\n<td>Réduire la fréquence maximale ; ventiler et ombrager le variateur</td>\n</tr>\n<tr>\n<td>Courant moteur trop élevé</td>\n<td>Sable, phase ou câble défectueux, tension basse</td>\n<td>Arrêter ; mesurer isolement et enroulements</td>\n</tr>\n<tr>\n<td>Déclenchement après un orage</td>\n<td>Surtension atmosphérique</td>\n<td>Remplacer les cartouches ; contrôler la terre</td>\n</tr>\n<tr>\n<td>Eau trouble ou sableuse</td>\n<td>Pompe trop près du fond, forage mal développé</td>\n<td>Remonter la pompe ; faire redévelopper le forage</td>\n</tr>\n<tr>\n<td>Le bassin baisse la nuit</td>\n<td>Fuite de géomembrane, vanne ou flotteur, évaporation</td>\n<td>Inspecter les soudures et raccords ; réparer</td>\n</tr>\n<tr>\n<td>Production plus faible que l&#39;an passé</td>\n<td>Salissure, vieillissement, ombrage, baisse de la nappe</td>\n<td>Mesurer Voc / Isc ; contrôler le niveau statique</td>\n</tr>\n</tbody></table></div>\n<h3>10.6 Sécurité</h3>\n<p>Les interventions électriques (variateur, câble moteur, parafoudres) se font <strong>champ PV sectionné</strong>, en sachant qu&#39;un module éclairé reste sous tension : on couvre les modules ou on intervient au sectionneur ouvert. 400 V en continu peut tuer. Seul un personnel formé et habilité intervient sur la partie DC.</p>\n" }, { "t": "Chapitre 11 – Exemple complet chiffré : 1 ha de maraîchage à Lubumbashi", "h": "<p>Ce chapitre reprend tout le calcul de bout en bout avec les valeurs par défaut du programme ; c&#39;est l&#39;exercice de référence à refaire à la calculatrice pendant la formation.</p>\n<p><strong>Données :</strong> 1 ha en aspersion (efficience 0,75), Kc = 1 ; forage NS 25 m, rabattement 10 m, Qfor 15 m³/h ; bassin à 50 m du forage (dénivelé 1,5 m) ; conduite d&#39;irrigation 150 m, pression 2,5 bar ; modules 550 Wc ; moteur monophasé 230 V.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Étape</th>\n<th>Calcul</th>\n<th>Résultat</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1. Mois critique</td>\n<td>max(V / HSP)</td>\n<td>Octobre</td>\n</tr>\n<tr>\n<td>2. Pluie efficace octobre</td>\n<td>(0,6 × 30 − 10) / 31</td>\n<td>0,26 mm/j</td>\n</tr>\n<tr>\n<td>3. Besoin net</td>\n<td>6,3 − 0,26</td>\n<td>6,04 mm/j</td>\n</tr>\n<tr>\n<td>4. Besoin brut</td>\n<td>6,04 / 0,75</td>\n<td>8,06 mm/j</td>\n</tr>\n<tr>\n<td>5. Volume journalier</td>\n<td>8,06 × 1 × 10</td>\n<td><strong>80,6 m³/j</strong></td>\n</tr>\n<tr>\n<td>6. Débit moyen</td>\n<td>80,6 / 6,85</td>\n<td>11,76 m³/h</td>\n</tr>\n<tr>\n<td>7. Débit de pointe</td>\n<td>1,25 × 11,76</td>\n<td><strong>14,70 m³/h</strong> (≤ 15 : OK)</td>\n</tr>\n<tr>\n<td>8. Diamètre minimal</td>\n<td>√(4 × 0,00408 / (π × 1,5))</td>\n<td>58,9 mm → PEHD DN75 (DI 66)</td>\n</tr>\n<tr>\n<td>9. Longueur hydraulique</td>\n<td>50 + 41</td>\n<td>91 m</td>\n</tr>\n<tr>\n<td>10. Pertes linéaires (Hazen-Williams, C = 140)</td>\n<td></td>\n<td>2,17 m</td>\n</tr>\n<tr>\n<td>11. Pertes singulières</td>\n<td>15 %</td>\n<td>0,33 m</td>\n</tr>\n<tr>\n<td>12. Hauteur géométrique</td>\n<td>35 + 1,5</td>\n<td>36,5 m</td>\n</tr>\n<tr>\n<td>13. HMT</td>\n<td>36,5 + 2,17 + 0,33 + 1</td>\n<td><strong>40 m</strong></td>\n</tr>\n<tr>\n<td>14. Énergie hydraulique</td>\n<td>2,725 × 80,6 × 40 / 1 000</td>\n<td>8,78 kWh/j</td>\n</tr>\n<tr>\n<td>15. Puissance hydraulique</td>\n<td>2,725 × 14,7 × 40</td>\n<td>1 602 W</td>\n</tr>\n<tr>\n<td>16. Puissance absorbée</td>\n<td>1 602 / 0,5</td>\n<td>3 205 W</td>\n</tr>\n<tr>\n<td>17. Moteur</td>\n<td>3 205 × 0,85 = 2 724 W</td>\n<td><strong>3 kW</strong>, pompe 6″</td>\n</tr>\n<tr>\n<td>18. Énergie électrique</td>\n<td>8,78 / (0,5 × 0,95)</td>\n<td>18,49 kWh/j</td>\n</tr>\n<tr>\n<td>19. Pc critère énergie</td>\n<td>18,49 / (6,85 × 0,8) × 1,1</td>\n<td>3 711 Wc</td>\n</tr>\n<tr>\n<td>20. Pc critère moteur</td>\n<td>3 000 × 1,3</td>\n<td>3 900 Wc</td>\n</tr>\n<tr>\n<td>21. Modules en série</td>\n<td>6 ≤ Ns ≤ 8</td>\n<td><strong>1 chaîne de 8 × 550 Wc = 4,4 kWc</strong></td>\n</tr>\n<tr>\n<td>22. Tensions</td>\n<td>Vmp chaud 292,7 V ; Voc froid 418,2 V</td>\n<td>OK (200–400 V ; &lt; 450 V)</td>\n</tr>\n<tr>\n<td>23. Courant moteur</td>\n<td>3 000 / (230 × 0,82 × 0,85)</td>\n<td>18,7 A</td>\n</tr>\n<tr>\n<td>24. Câble moteur</td>\n<td>51 m, ΔU 3 %</td>\n<td>5,1 → <strong>6 mm²</strong></td>\n</tr>\n<tr>\n<td>25. Câble DC</td>\n<td>minimum programme</td>\n<td>4 mm² H1Z2Z2-K</td>\n</tr>\n<tr>\n<td>26. Protections</td>\n<td>1,25 × 18,7 ; 1,2 × 418</td>\n<td>Disjoncteur 25 A ; parafoudre DC 600 V</td>\n</tr>\n<tr>\n<td>27. Forage</td>\n<td>rabattement 9,8 m ; immersion 6,2 m ; garde 15 m</td>\n<td>OK</td>\n</tr>\n<tr>\n<td>28. Bassin</td>\n<td>fond 2,5 m, crête 10,6 m, H 2,7 m</td>\n<td>87,9 m³ utiles</td>\n</tr>\n<tr>\n<td>29. Surpresseur</td>\n<td>HMT 34,9 m</td>\n<td>2,2 kW + 6 modules (3,3 kWc)</td>\n</tr>\n<tr>\n<td>30. Devis</td>\n<td></td>\n<td>35 944 USD TTC</td>\n</tr>\n<tr>\n<td>31. Rentabilité</td>\n<td>VAN 12 % / TRI</td>\n<td>26 997 USD / 25 %</td>\n</tr>\n</tbody></table></div>\n<p><strong>Contrôle de cohérence à faire systématiquement :</strong></p>\n<ul>\n<li>Production solaire en octobre : 4 400 × 6,85 × 0,8 × 0,95 × 0,5 / (2,725 × 40) ≈ 105 m³/j, limitée à 15 × 6,85 = 102,75 m³/j par le forage. On couvre 128 % du besoin : le champ est bien dimensionné et le forage est utilisé presque à fond.</li>\n<li>Ordre de grandeur : environ <strong>1 kWc pour 18 à 20 m³/j à 40 m de HMT</strong> dans ce climat. Si un résultat s&#39;en éloigne beaucoup, rechercher l&#39;erreur de saisie.</li>\n</ul>\n<p><strong>Présentation au client en trois phrases :</strong> « Votre hectare a besoin de 81 m³ d&#39;eau par jour en octobre. Une pompe solaire de 3 kW avec 8 panneaux remplit votre bassin de 88 m³ en une journée de soleil, sans carburant. L&#39;investissement total est d&#39;environ 36 000 USD, récupéré en un peu moins de 4 ans aux hypothèses de production retenues. »</p>\n" }, { "t": "Chapitre 12 – Exercices corrigés", "h": "<p>Ces exercices vérifient qu&#39;un technicien maîtrise chaque étape ; faites-les sans le programme, puis contrôlez avec lui.</p>\n<h3>Exercice 1 – Pluie efficace</h3>\n<p>Calculer la pluie efficace en mm/j pour avril (50 mm, 30 jours) et pour novembre (165 mm, 30 jours).</p>\n<p><strong>Corrigé.</strong> Avril : P ≤ 70 mm, donc 0,6 × 50 − 10 = 20 mm/mois, soit 20 / 30 = <strong>0,67 mm/j</strong>. Novembre : P &gt; 70 mm, donc 0,8 × 165 − 25 = 107 mm/mois, soit <strong>3,57 mm/j</strong>.</p>\n<h3>Exercice 2 – Volume journalier</h3>\n<p>Un client veut irriguer <strong>2 ha en goutte-à-goutte</strong> (efficience 0,90), Kc = 1, à Lubumbashi. Quel volume pomper en octobre ?</p>\n<p><strong>Corrigé.</strong> Besoin net = 6,3 − 0,26 = 6,04 mm/j ; brut = 6,04 / 0,90 = 6,71 mm/j ; V = 6,71 × 2 × 10 = <strong>134,2 m³/j</strong>.</p>\n<h3>Exercice 3 – Vérification du forage</h3>\n<p>Le forage du client de l&#39;exercice 2 donne 15 m³/h. Est-ce suffisant ? Sinon, quelle surface maximale peut-on irriguer ?</p>\n<p><strong>Corrigé.</strong> Qmoy = 134,2 / 6,85 = 19,6 m³/h ; Qp = 1,25 × 19,6 = <strong>24,5 m³/h &gt; 15 : NON</strong>. Surface maximale : Qp ≤ 15 donne V ≤ 15 × 6,85 / 1,25 = 82,2 m³/j, soit S ≤ 82,2 / 67,1 = <strong>1,2 ha</strong>. Il faut donc soit réduire à 1,2 ha, soit faire un second forage.</p>\n<h3>Exercice 4 – Énergie et champ PV</h3>\n<p>V = 60 m³/j, HMT = 50 m, HSP = 6, rendements 0,50 (motopompe) et 0,95 (variateur), kPV = 0,8, marge 1,1. Calculer Eh, Eel et la puissance crête au critère énergie.</p>\n<p><strong>Corrigé.</strong> Eh = 2,725 × 60 × 50 / 1 000 = <strong>8,18 kWh/j</strong> ; Eel = 8,18 / (0,5 × 0,95) = <strong>17,2 kWh/j</strong> ; Pc = 17,2 / (6 × 0,8) × 1,1 = <strong>3,94 kWc</strong>.</p>\n<h3>Exercice 5 – Chaîne de modules</h3>\n<p>Module 450 Wc : Voc 41,0 V, Vmp 34,5 V, kVoc −0,28 %/°C, kVmp −0,36 %/°C. Tmin 5 °C, Tcellule 60 °C. Variateur : MPPT 200–400 V, Vmax 450 V. Puissance requise 3 900 Wc. Combien de modules en série ?</p>\n<p><strong>Corrigé.</strong></p>\n<ul>\n<li>Voc froid = 41,0 × (1 + 0,0028 × 20) = 43,30 V ; Vmp chaud = 34,5 × (1 − 0,0036 × 35) = 30,15 V.</li>\n<li>Ns min = ⌈200 / 30,15⌉ = ⌈6,63⌉ = <strong>7</strong>.</li>\n<li>Ns max = min(⌊450 / 43,30⌋ ; ⌊400 / 34,5⌋) = min(10 ; 11) = <strong>10</strong>.</li>\n<li>Modules nécessaires : 3 900 / 450 = 8,7, soit <strong>9 modules en 1 chaîne</strong> (4 050 Wc). Vérification : Vmp chaud 9 × 30,15 = 271 V (OK) ; Voc froid 9 × 43,30 = 390 V (&lt; 450 V, OK).</li>\n</ul>\n<h3>Exercice 6 – Câble d&#39;un moteur triphasé</h3>\n<p>Moteur 5,5 kW triphasé 380 V, cos φ 0,82, rendement 0,85, longueur de câble 70 m, ΔU 3 %, ρ = 0,0225. Calculer le courant, la section et le calibre du disjoncteur.</p>\n<p><strong>Corrigé.</strong> I = 5 500 / (√3 × 380 × 0,82 × 0,85) = <strong>12,0 A</strong>. S = √3 × 0,0225 × 70 × 12,0 × 0,82 / (0,03 × 380) = 2,35 mm², donc <strong>2,5 mm²</strong> (minimum du programme ; câble immergé 4G2,5). Disjoncteur ≥ 1,25 × 12,0 = 15 A, donc <strong>16 A</strong>.</p>\n<h3>Exercice 7 – Immersion de la pompe</h3>\n<p>Forage : NS 30 m, essai à 10 m³/h avec 8 m de rabattement, profondeur totale 48 m. Pompe posée à 40 m, débit de pointe 9 m³/h. L&#39;installation est-elle correcte ?</p>\n<p><strong>Corrigé.</strong> qs = 10 / 8 = 1,25 m³/h/m ; rabattement à 9 m³/h = 9 / 1,25 = 7,2 m ; niveau dynamique = 37,2 m ; immersion = 40 − 37,2 = <strong>2,8 m &lt; 3 m : NON</strong>. Solution : descendre la pompe à 42 m (immersion 4,8 m ; garde au fond 48 − 42 = 6 m ≥ 3 m : OK).</p>\n<h3>Exercice 8 – HMT avec bassin</h3>\n<p>NS 20 m, rabattement 6 m, dénivelé forage → bassin 2 m, pertes linéaires 3,0 m, pertes singulières 15 %, charge d&#39;arrivée 1 m. Calculer la HMT.</p>\n<p><strong>Corrigé.</strong> ND = 26 m ; Hgéo = 26 + 2 = 28 m ; pertes singulières = 0,45 m ; HMT = 28 + 3,0 + 0,45 + 1 = <strong>32,5 m</strong>.</p>\n<h3>Questions de compréhension (oral)</h3>\n<ol>\n<li>Pourquoi dimensionne-t-on sur le mois où V / HSP est maximal et non sur le mois où V est maximal ?</li>\n<li>Pourquoi faut-il un ratio PV / moteur d&#39;au moins 1,2 même si le critère énergie donne moins ?</li>\n<li>Que se passe-t-il si l&#39;on met 10 modules en série dans l&#39;exemple du chapitre 11 ? (Réponse : Voc froid = 523 V &gt; 450 V, le variateur est détruit le premier matin froid.)</li>\n<li>Pourquoi le bassin permet-il une pompe immergée plus petite ?</li>\n<li>Quelle mesure simple prouve au client que l&#39;installation fonctionne comme prévu ? (Réponse : le débit à midi par beau temps et le volume journalier au compteur, comparés aux valeurs de référence.)</li>\n</ol>\n" }, { "t": "Chapitre 13 – Limites, précautions, sources et glossaire", "h": "<p>Le programme donne un pré-dimensionnement solide, mais il ne remplace ni l&#39;essai de pompage, ni la courbe du fabricant, ni le jugement du technicien sur le terrain.</p>\n<h3>13.1 Les limites de la méthode</h3>\n<ul>\n<li><strong>Climat :</strong> les valeurs ETo et pluie par défaut sont des ordres de grandeur. Pour un vrai projet, utiliser CLIMWAT / CROPWAT (FAO) ou une station météo, et un outil d&#39;ensoleillement pour les HSP.</li>\n<li><strong>Kc unique :</strong> le programme utilise un seul Kc pour toute l&#39;année. Un calcul culture par culture et stade par stade (FAO 56) est plus précis pour un grand périmètre.</li>\n<li><strong>Pluie efficace :</strong> la formule FAO simplifiée est mensuelle ; une pluie très irrégulière peut être moins efficace que prévu.</li>\n<li><strong>Rabattement linéaire :</strong> valable seulement pour un débit inférieur ou égal au débit d&#39;essai.</li>\n<li><strong>Rendement constant :</strong> le rendement réel d&#39;une pompe varie avec le débit et la vitesse ; seule la courbe du fabricant donne la valeur exacte au point de fonctionnement.</li>\n<li><strong>Prix et rendements agricoles :</strong> hypothèses à confirmer avec l&#39;exploitant et le marché ; le plan d&#39;affaires n&#39;est pas un conseil financier.</li>\n<li><strong>Fiscalité :</strong> impôt 30 % et TVA 16 % à vérifier selon le régime du client.</li>\n</ul>\n<h3>13.2 Précautions avant de signer un devis</h3>\n<ol>\n<li>Exiger le rapport de forage et d&#39;essai de pompage (ou le faire réaliser).</li>\n<li>Faire une analyse de l&#39;eau (sable, fer, salinité) avant de choisir la pompe.</li>\n<li>Demander au fournisseur la courbe de la pompe au point de fonctionnement calculé et la fiche du variateur (plage MPPT, Vmax).</li>\n<li>Vérifier sur place l&#39;absence d&#39;ombrage pour le champ PV et la nature du sol pour le bassin.</li>\n<li>Mettre à jour les prix unitaires du devis à la date de l&#39;offre.</li>\n</ol>\n<h3>13.3 Sources de la méthode</h3>\n<ul>\n<li>FAO, <em>Bulletin d&#39;irrigation et de drainage n° 56 : Évapotranspiration des cultures</em> (Allen et al., 1998) : ETo, Kc, besoins des cultures.</li>\n<li>FAO, logiciels et bases CROPWAT et CLIMWAT : données climatiques et pluie efficace.</li>\n<li>Formule de Hazen-Williams : pertes de charge dans les conduites d&#39;eau.</li>\n<li>Règles de chute de tension et de section des câbles (pratique NF C 15-100 / CEI 60364) et guides UTE C 15-712 pour la partie photovoltaïque (parafoudres, fusibles gPV).</li>\n<li>Fiches techniques des fabricants de modules, pompes immergées et variateurs solaires.</li>\n</ul>\n<h3>13.4 Glossaire</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Terme</th>\n<th>Définition</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>ETo</strong></td>\n<td>Évapotranspiration de référence (mm/j) : eau perdue par une pelouse de référence</td>\n</tr>\n<tr>\n<td><strong>ETc</strong></td>\n<td>Évapotranspiration de la culture = ETo × Kc</td>\n</tr>\n<tr>\n<td><strong>Kc</strong></td>\n<td>Coefficient cultural</td>\n</tr>\n<tr>\n<td><strong>Pluie efficace</strong></td>\n<td>Part de la pluie réellement utile à la plante</td>\n</tr>\n<tr>\n<td><strong>Efficience</strong></td>\n<td>Part de l&#39;eau pompée réellement utilisée par la culture</td>\n</tr>\n<tr>\n<td><strong>HSP</strong></td>\n<td>Heures de soleil plein : énergie solaire du jour exprimée en heures à 1 000 W/m²</td>\n</tr>\n<tr>\n<td><strong>NS / ND</strong></td>\n<td>Niveau statique (au repos) / niveau dynamique (en pompage)</td>\n</tr>\n<tr>\n<td><strong>Rabattement</strong></td>\n<td>Baisse du niveau d&#39;eau provoquée par le pompage</td>\n</tr>\n<tr>\n<td><strong>Débit spécifique</strong></td>\n<td>Débit par mètre de rabattement (m³/h/m)</td>\n</tr>\n<tr>\n<td><strong>HMT</strong></td>\n<td>Hauteur manométrique totale : hauteur géométrique + pertes de charge + pression</td>\n</tr>\n<tr>\n<td><strong>Pertes de charge</strong></td>\n<td>Perte de pression due au frottement de l&#39;eau (linéaires) et aux accessoires (singulières)</td>\n</tr>\n<tr>\n<td><strong>Wc / kWc</strong></td>\n<td>Watt-crête : puissance d&#39;un module aux conditions standard (1 000 W/m², 25 °C)</td>\n</tr>\n<tr>\n<td><strong>Voc / Vmp</strong></td>\n<td>Tension à vide / tension au point de puissance maximale</td>\n</tr>\n<tr>\n<td><strong>Isc</strong></td>\n<td>Courant de court-circuit d&#39;un module</td>\n</tr>\n<tr>\n<td><strong>String / chaîne</strong></td>\n<td>Modules connectés en série</td>\n</tr>\n<tr>\n<td><strong>MPPT</strong></td>\n<td>Suivi du point de puissance maximale, assuré par le variateur</td>\n</tr>\n<tr>\n<td><strong>VFD</strong></td>\n<td>Variateur de fréquence (variateur solaire de pompage)</td>\n</tr>\n<tr>\n<td><strong>Ucpv</strong></td>\n<td>Tension maximale de service d&#39;un parafoudre DC</td>\n</tr>\n<tr>\n<td><strong>gPV</strong></td>\n<td>Fusibles spéciaux pour courant continu photovoltaïque</td>\n</tr>\n<tr>\n<td><strong>Marche à sec</strong></td>\n<td>Fonctionnement de la pompe sans eau, qui la détruit</td>\n</tr>\n<tr>\n<td><strong>VAN / TRI</strong></td>\n<td>Valeur actuelle nette / taux de rentabilité interne</td>\n</tr>\n<tr>\n<td><strong>DSCR</strong></td>\n<td>Ratio de couverture du service de la dette (exigé ≥ 1,2 par les banques)</td>\n</tr>\n<tr>\n<td><strong>EBE</strong></td>\n<td>Excédent brut d&#39;exploitation</td>\n</tr>\n</tbody></table></div>\n<hr>\n<p><em>MUPGLOBAL SARL · Lubumbashi, RD Congo · WhatsApp +243 995 679 353 · <a href=\"mailto:dieumercimupole9@gmail.com\">dieumercimupole9@gmail.com</a> — document de formation interne.</em></p>\n" }];

        if (DEMO && c >= DEMO_CH) {
            toast("Chapitre réservé à la version sous licence");
            return setTimeout(() => openLicence(), 600);
        }
        chap = c;
        render();
        window.scrollTo(0, 0);
        return;
    }
    if ("install" in d)
        return doInstall();
    if ("instx" in d) {
        $("#instbar").hidden = true;
        return;
    }
    if ("lic" in d)
        return openLicence();
    if ("copydev" in d)
        return copy(fmtCode(DEVICE));
    if ("copylink" in d)
        return copy(location.href.split("#")[0]);
    if ("print" in d)
        return window.print();
    if ("share" in d)
        return share(d.share === "devis" ? devText() : d.share === "rap" ? rapText() : `*Fiche d'exploitation – ${S.nom}*\nDébit attendu à midi : ${n1(R.QP)} m³/h\nVolume (${R.MOISDIM}) : ${n1(R.VDIM)} m³/j\nPression tête de forage : ${n2(R.PRESTETE)} bar\nNiveau statique : ${n1(S.ns)} m – rabattement attendu ${n1(R.RABP)} m\nCourant moteur : ${n1(R.IMOT)} A\nVoc chaîne : ${n1(R.ST.nser * S.mod.voc)} V\n${COMPANY} – ${PHONE}`);
    if ("copy" in d)
        return copy(rapText());
    if (t.id === "btn-proj")
        return DEMO ? openLicence() : openProjects();
    if (DEMO && ["pnew", "pdup", "popen", "prm", "pexp", "cadd", "cdel", "preset"].some((k) => k in d))
        return blocked();
    if ("pnew" in d)
        return newProject("ex");
    if ("pdup" in d)
        return newProject("dup");
    if ("popen" in d) {
        store.cur = d.popen;
        S = migrate(store.items[store.cur].st);
        persist();
        closeSheet();
        commit();
        return toast("Projet ouvert : " + S.nom);
    }
    if ("prm" in d) {
        if (Object.keys(store.items).length < 2)
            return toast("Il faut garder au moins un projet");
        if (!confirm("Supprimer ce projet ?"))
            return;
        delete store.items[d.prm];
        if (store.cur === d.prm) {
            store.cur = Object.keys(store.items)[0];
            S = migrate(store.items[store.cur].st);
        }
        persist();
        commit();
        return openProjects();
    }
    if ("pexp" in d)
        return download(`MUPGLOBAL_Pompage_${asciiName(S.nom)}.json`, JSON.stringify({ app: "mupglobal-pompage", v: 1, projets: Object.values(store.items).map((x) => x.st) }, null, 1));
    if ("cadd" in d) {
        if (S.cult.length >= 8)
            return toast("8 cultures au maximum");
        S.cult.push({ n: "Nouvelle culture", part: 0, cyc: 1, rdt: 10, pert: 0.1, prix: 0.5, cv: 1000 });
        return commit();
    }
    if ("cdel" in d) {
        S.cult.splice(+d.cdel, 1);
        return commit();
    }
    if ("preset" in d) {
        delete S.prix[d.preset];
        return commit();
    }
});
const num = (v) => parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
document.addEventListener("change", async (e) => {
    const el = e.target;
    if (el.dataset.pimp !== undefined && el.files && el.files[0]) {
        if (DEMO)
            return blocked();
        try {
            const j = JSON.parse(await el.files[0].text());
            const list = j.projets || (j.nom ? [j] : []);
            if (!list.length)
                throw 0;
            list.forEach((st) => { const id = uid(); store.items[id] = { st: migrate(st), t: Date.now() }; store.cur = id; });
            S = migrate(store.items[store.cur].st);
            persist();
            closeSheet();
            commit();
            toast(`${list.length} projet(s) importé(s)`);
        }
        catch (er) {
            toast("Fichier non reconnu");
        }
        return;
    }
    if (el.dataset.p) {
        if (DEMO) {
            render();
            return blocked();
        }
        const p = el.dataset.p;
        let v = el.value;
        if (el.tagName !== "SELECT" && el.dataset.t !== "txt") {
            v = num(v);
            if (!isFinite(v)) {
                toast("Valeur non valide");
                return render();
            }
            if (el.dataset.pct)
                v = v / 100;
        }
        set(p, v);
        commit();
        return;
    }
    if (el.dataset.price) {
        if (DEMO) {
            render();
            return blocked();
        }
        const v = num(el.value);
        if (isFinite(v) && v >= 0)
            S.prix[el.dataset.price] = v;
        commit();
    }
});
render();
if (DEMO)
    openLicence(RBLOCK ? RB_MSG : LIC.expired ? LIC.why : LICRAW ? LIC.why : "");
setTimeout(rbCheck, 2500);
window.addEventListener("online", () => setTimeout(rbCheck, 1500));
setInterval(rbCheck, 6 * 3600 * 1000);
</script>
