:root {
  --bg: #F3F6F2; --surface: #FFFFFF; --surface-2: #E9EFE8; --line: #D5DED3;
  --fg: #16231A; --muted: #56655A; --brand: #0B5A2E; --brand-2: #1F7A4D; --on-brand: #FFFFFF;
  --gold: #E8A317; --gold-ink: #8A5A00;
  --ok: #1C7C43; --ok-bg: #E1F2E6; --ko: #B42318; --ko-bg: #FBE7E4; --info: #1F5F99; --info-bg: #E3EDF8;
  --s-pv: #B9820A; --s-load: #1F7A4D; --s-soc: #1F7A4D;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgba(11, 40, 22, .06), 0 4px 14px rgba(11, 40, 22, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1611; --surface: #16211A; --surface-2: #1D2B22; --line: #2B3B30;
  --fg: #E7EFE8; --muted: #9DB0A2; --brand: #2E8A57; --brand-2: #3A9E6C; --on-brand: #FFFFFF;
  --gold: #E8B13A; --gold-ink: #F0C565;
  --ok: #5CC98A; --ok-bg: #173523; --ko: #F2897B; --ko-bg: #3A1D19; --info: #8DB8E8; --info-bg: #182A3D;
  --s-pv: #BE7F12; --s-load: #38A06E; --s-soc: #38A06E; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1611; --surface: #16211A; --surface-2: #1D2B22; --line: #2B3B30;
  --fg: #E7EFE8; --muted: #9DB0A2; --brand: #2E8A57; --brand-2: #3A9E6C; --on-brand: #FFFFFF;
  --gold: #E8B13A; --gold-ink: #F0C565;
  --ok: #5CC98A; --ok-bg: #173523; --ko: #F2897B; --ko-bg: #3A1D19; --info: #8DB8E8; --info-bg: #182A3D;
  --s-pv: #BE7F12; --s-load: #38A06E; --s-soc: #38A06E; --shadow: none; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0 }
button, input, select { font: inherit; color: inherit }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100% }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent }
textarea, input, select { font-size: max(16px, 1em) }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* en-tête */
.top { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--on-brand) }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px }
.top img { width: 40px; height: 40px; border-radius: 10px; background: #fff; padding: 3px; flex: none }
.top .who { flex: 1; min-width: 0 }
.top .co { font: 600 13px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase }
.top .pn { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top button { background: rgba(255,255,255,.14); border: 0; border-radius: 10px; padding: 8px 12px; color: var(--on-brand); font-weight: 700; font-size: 13px; cursor: pointer }
.strip { background: var(--brand-2); color: var(--on-brand); font-size: 13px }
.strip .wrap { display: flex; gap: 14px; padding-block: 6px; overflow-x: auto; white-space: nowrap; scrollbar-width: none }
.strip b { font-weight: 700 }
.pbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-block: 10px 2px }
.pbar button { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 6px; font: 700 13px/1.15 var(--body); color: #fff; cursor: pointer; min-height: 44px }
.pbar button svg { width: 18px; height: 18px; flex: none }
.pbar .p1 { background: #0B5A2E } .pbar .p2 { background: #1F5F99 } .pbar .p3 { background: #B9770E }
@media print { .pbar { display: none } }
.strip .bad { background: var(--ko); border-radius: 99px; padding: 0 8px }

main { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)) }
.view { display: grid; gap: 14px; padding-block: 16px }
.view[hidden] { display: none }
.live-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px }
.live-kpi div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px }
.live-kpi b { font-size: 16px }
@media (max-width: 420px) { .live-kpi { grid-template-columns: repeat(2, 1fr) } }
.h-sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px }
.h-sec h2 { font-size: 17px }
.eyebrow { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0 }
.muted { color: var(--muted) }
.small { font-size: 13px }

/* synthèse du système */
.hero { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow) }
.hero .head { padding: 14px 14px 10px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.hero .head h1 { font-size: 20px; line-height: 1.2 }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.kit { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line) }
.kit > div { padding: 12px 14px; border-bottom: 1px solid var(--line); min-width: 0 }
.kit > div:nth-child(odd) { border-right: 1px solid var(--line) }
.kit .v { font: 600 22px/1.15 var(--display) }
.kit .v small { font-size: 13px; font-weight: 500; color: var(--muted) }
.kit .l { font-size: 12.5px; color: var(--muted) }
.kit .d { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere }
.money { display: grid; grid-template-columns: 1.2fr 1fr; gap: 0; background: var(--surface-2) }
.money > div { padding: 12px 14px }
.money .v { font: 700 24px/1.1 var(--display) }
.money .gold { color: var(--gold-ink) }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px }
.stats > div { display: flex; flex-direction: column; justify-content: space-between }
.stats .l { font-size: 12px; color: var(--muted); line-height: 1.25 }
.stats .sv2 { font: 600 16px/1.2 var(--display); margin-top: 3px; white-space: nowrap }
.energy .bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 10px 0 8px; gap: 2px; background: var(--surface) }
.energy .bar span { display: block }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }

.checks { display: grid; gap: 8px }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14px }
.chk svg { flex: none; margin-top: 2px }
.chk.ok { background: var(--ok-bg); color: var(--ok) }
.chk.ko { background: var(--ko-bg); color: var(--ko) }
.chk.info { background: var(--info-bg); color: var(--info) }
.chk span { color: var(--fg) }

/* graphiques */
.chart { position: relative; width: 100% }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s }
.axis { fill: var(--muted); font-size: 10px; font-family: var(--body) }
.grid { stroke: var(--line); stroke-width: 1 }

/* détails */
details.card { padding: 0 }
details > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700 }
details > summary::-webkit-details-marker { display: none }
details > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; flex: none; margin-right: 4px }
details[open] > summary::after { transform: rotate(-135deg) }
details > summary .sv { font-weight: 600; color: var(--muted); font-size: 13px; margin-left: auto; text-align: right }
.dbody { padding: 0 14px 14px; display: grid; gap: 2px }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px }
.kv:last-child { border-bottom: 0 }
.kv span:first-child { color: var(--muted) }
.kv span:last-child { text-align: right; font-weight: 600; overflow-wrap: anywhere }
.tbl { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap }
th:first-child, td:first-child { text-align: left; white-space: normal }
th { color: var(--muted); font-weight: 600; font-size: 12px }

/* appareils */
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.totals > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px }
.totals .v { font: 600 18px/1.1 var(--display) }
.totals .l { font-size: 12px; color: var(--muted) }
.loads { display: grid; gap: 8px }
.load { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100% }
.load.off { opacity: .55 }
.load .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand-2) }
.load .nm { font-weight: 700; overflow-wrap: anywhere }
.load .sub { font-size: 12.5px; color: var(--muted) }
.load .en { text-align: right; font-weight: 700; font-size: 14px; white-space: nowrap }
.load .en small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: var(--brand); color: var(--on-brand); text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px }
.btn.ghost { background: var(--surface); color: var(--brand-2); border: 1px solid var(--line) }
.btn.gold { background: var(--gold); color: #2B1C00 }
.btn.danger { background: var(--ko-bg); color: var(--ko) }
.btn.wide { width: 100% }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.row > .btn { flex: 1 1 140px }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap }
.chip:active { background: var(--surface-2) }

/* formulaires */
.form { display: grid; gap: 12px }
.f { display: grid; gap: 5px; min-width: 0 }
.f label { font-size: 13px; font-weight: 700 }
.f .hint { font-size: 12px; color: var(--muted) }
.f input, .f select { width: 100%; min-height: 44px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px }
.f input:focus, .f select:focus, .btn:focus-visible, .chip:focus-visible, .load:focus-visible, summary:focus-visible, .nav button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.unit { position: relative }
.unit input { padding-right: 34px }
.unit em { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 13px; pointer-events: none }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 9px 6px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-2); box-shadow: var(--shadow) }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px }
.switch input { width: 46px; height: 28px; appearance: none; background: var(--line); border-radius: 99px; position: relative; cursor: pointer; flex: none; transition: background .15s }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s }
.switch input:checked { background: var(--brand-2) }
.switch input:checked::after { transform: translateX(18px) }

/* devis */
.lot { display: grid; gap: 0 }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px }
.item:last-child { border-bottom: 0 }
.item .ds { min-width: 0 }
.item .ds small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere }
.item .m { font-weight: 700; text-align: right; white-space: nowrap }
.item .pu { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted) }
.item .pu input { width: 96px; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-size: 16px }
.item.zero { display: none }
.tot { display: grid; gap: 0 }
.tot .kv span:last-child { font-variant-numeric: tabular-nums }
.tot .grand { font: 700 20px/1.2 var(--display); border-top: 2px solid var(--fg); border-bottom: 0; padding-top: 10px; margin-top: 4px }
.tot .grand span:first-child { color: var(--fg) }

/* rapport */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.report .rh { background: var(--brand); color: var(--on-brand); padding: 16px; display: flex; gap: 12px; align-items: center }
.report .rh img { width: 54px; height: 54px; background: #fff; border-radius: 12px; padding: 4px }
.report .rh h2 { font-size: 18px }
.report .rb { padding: 6px 16px 16px }
.report h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-2); margin: 16px 0 4px }
.report .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px }
.report .sign div { border: 1px solid var(--line); border-radius: 10px; height: 84px; padding: 8px; font-size: 12px; color: var(--muted) }
.foot { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0 0 }
.contact { display: grid; gap: 6px; font-size: 14px }
.contact .num { font: 600 18px/1.2 var(--display); user-select: all }

/* navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
.nav .in { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }
.nav button { border: 0; background: none; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer }
.nav button[aria-current="page"] { color: var(--brand-2) }
.nav button[aria-current="page"] svg { background: var(--surface-2); border-radius: 99px }
.nav svg { width: 44px; height: 26px; padding: 2px 10px }

/* feuille modale */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 20, 10, .45) }
.sheet[hidden] { display: none !important }
.sheet .panel { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; max-height: calc(92dvh - env(safe-area-inset-top, 0px)); -webkit-overflow-scrolling: touch; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px 0 calc(16px + env(safe-area-inset-bottom, 0px)) }
.sheet .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 10px }
.sheet .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px }
.sheet .ph h2 { font-size: 18px }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1 }
.proj { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.proj.cur { border-color: var(--brand-2); box-shadow: inset 3px 0 0 var(--brand-2) }
.proj .pi { flex: 1; min-width: 0 }
.proj .pi b { display: block; overflow-wrap: anywhere }
.proj button { border: 0; background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 12.5px; cursor: pointer }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90% }
.toast.on { opacity: 1 }

/* v2 : visuels, présentation, simulateur */
.ds.ico { display: flex; gap: 8px; align-items: center }
.ds.ico .pi { flex: none; width: 34px; height: 34px }
.unibox svg { display: block; width: 100%; height: auto }
.tile2 { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; box-shadow: var(--shadow) }
.tile2 b { font: 600 17px/1.25 var(--display) }
#v-plus { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
.simctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.simctl input[type=range] { width: 100%; accent-color: var(--brand-2); min-height: 32px }
#simsvg { width: 100%; min-width: 620px; height: auto; display: block }
.chip[aria-pressed="true"] { background: var(--ko-bg); color: var(--ko); border-color: var(--ko) }
.stage { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 14px; overflow: hidden; background: radial-gradient(120% 120% at 10% 0%, #146B3A 0%, #0B3B22 55%, #08271A 100%); color: #F2F7F3; outline: none }
.stage:focus-visible { outline: 3px solid var(--gold) }
.slide { position: absolute; inset: 0; padding: clamp(14px, 4%, 40px); display: none; overflow: hidden }
.slide.on { display: block }
.ps { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; max-width: 980px; margin: 0 auto }
.ps.two { display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; gap: 20px }
.ps.cover { align-items: flex-start }
.ps.cover img { width: 64px; height: 64px; background: #fff; border-radius: 14px; padding: 5px }
.ps h2 { font: 600 clamp(18px, 3vw, 30px)/1.2 var(--display); color: #fff }
.ps h2.big { font-size: clamp(24px, 4.6vw, 46px) }
.ps p { margin: 0; color: #CFE3D6; font-size: clamp(13px, 1.6vw, 17px) }
.eyebrow2 { font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #F7C948 }
.huge { font: 700 clamp(34px, 7vw, 72px)/1 var(--display); color: #fff }
.huge small { font-size: .32em; font-weight: 500; color: #CFE3D6 }
.pbarbox { display: flex; height: 34px; border-radius: 99px; overflow: hidden; gap: 3px; max-width: 640px }
.pbarbox span { display: flex; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 700; white-space: nowrap; width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1) .5s; overflow: hidden }
.slide.on .pbarbox span { width: var(--w) }
.bjour { background: #F7C948; color: #3A2B00 } .bnuit { background: #2E86C1; color: #fff }
.plist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: clamp(13px, 1.6vw, 17px) }
.plist li { padding-left: 18px; position: relative } .plist li::before { content: ""; position: absolute; left: 0; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: #7DF0A8 }
.plist.big { font-size: clamp(14px, 2vw, 20px); gap: 12px }
.ptiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px }
.ptiles div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 10px; display: grid; gap: 2px }
.ptiles b { font: 700 clamp(15px, 2.4vw, 24px)/1.1 var(--display); color: #fff } .ptiles div > span { font-size: 12px; color: #CFE3D6 }
.pitems { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.pitems div { background: rgba(255,255,255,.92); color: #14241A; border-radius: 12px; padding: 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700 }
.pitems .pi { width: 44px; height: 44px; flex: none }
.pflow, .pcum { width: 100%; height: auto }
.pf { fill: none; stroke-width: 4; stroke-dasharray: 6 10; animation: pfl 1s linear infinite } .pf.up { animation-direction: reverse }
@keyframes pfl { to { stroke-dashoffset: -32 } }
.pcta { font: 700 clamp(22px, 4vw, 40px)/1 var(--display); color: #F7C948; user-select: all }
.slide .a { opacity: 0; transform: translateY(14px) }
.slide.on .a { animation: pin .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0ms) }
@keyframes pin { to { opacity: 1; transform: none } }
.slide .pbar { transform-origin: bottom; transform: scaleY(0) } .slide.on .pbar { animation: pgrow .6s ease forwards; animation-delay: calc(var(--d) + 500ms) }
@keyframes pgrow { to { transform: none } }
.night { } .pprog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15) } .pprog span { display: block; height: 100%; width: 0; background: #F7C948 }
.pdots { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap }
.pdots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; padding: 0 } .pdots button[aria-current] { background: var(--brand-2); width: 22px; border-radius: 99px }
@media (max-width: 640px) { .stage { aspect-ratio: 4 / 5 } .ps.two { grid-template-columns: 1fr; gap: 10px } .ptiles { grid-template-columns: 1fr 1fr 1fr } }
@media (prefers-reduced-motion: reduce) { .slide .a, .slide.on .a { opacity: 1; transform: none; animation: none } .slide .pbar { transform: none; animation: none } .pf { animation: none } .pbarbox span { transition: none } }
@media (min-width: 760px) {
  .view.two { grid-template-columns: 1fr 1fr; align-items: start }
  .view.two > .full { grid-column: 1 / -1 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
@media print {
  .top, .strip, .nav, .noprint { display: none !important }
  main { padding: 0 }
  .view[hidden] { display: none !important }
  .view:not([hidden]) { display: block !important }
  body { background: #fff; color: #000 }
}

/* --- spécifique pompage --- */
:root { --water: #1F6FA8; --water-bg: #E3EFF8 }
.top { background: linear-gradient(120deg, #0B5A2E, #0B4F7A) }
.strip { background: #0F6A86 }
.pump-hero { background: linear-gradient(160deg, #0B5A2E, #0B4F7A); color: #fff; border-radius: var(--r); padding: 16px; display: grid; gap: 10px }
.pump-hero h1 { font-size: 19px; line-height: 1.25 }
.pump-hero .eyebrow { color: #F5C542 }
.ph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.ph-grid > div { background: rgba(255,255,255,.1); border-radius: 12px; padding: 10px 12px; min-width: 0 }
.ph-grid .v { font: 700 21px/1.15 var(--display) }
.ph-grid .v small { font-size: 12px; font-weight: 600; opacity: .85 }
.ph-grid .l { font-size: 12px; opacity: .85 }
.ph-grid .d { font-size: 12.5px; margin-top: 2px; opacity: .95; overflow-wrap: anywhere }
.money2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 12px }
.money2 .v { font: 700 22px/1.1 var(--display); color: #F5C542 }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr } }
.clim input, .cult input { width: 100%; min-width: 52px; min-height: 40px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-size: 16px }
.cult input.n { text-align: left; min-width: 120px }
.clim td, .cult td { padding: 4px 3px }
.dvt { table-layout: fixed; width: 100% }
.dvt td { white-space: normal; vertical-align: top; overflow-wrap: anywhere }
.dvt td.num { text-align: right; white-space: nowrap }
.dvt input { width: 100%; min-height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; text-align: right; background: var(--surface); font-size: 16px }
.dvt .dvlot td { background: var(--surface-2); font-weight: 700; text-align: left }
.dvt .mod input { border-color: var(--gold); background: #FFF8E6 }
.book { font: 16px/1.6 var(--body) }
.book h3 { font-size: 17px; margin: 18px 0 6px; color: var(--brand-2) }
.book p { margin: 8px 0 }
.book ul, .book ol { padding-left: 22px }
.book li { margin: 4px 0 }
.book blockquote { margin: 10px 0; padding: 10px 12px; border-left: 4px solid var(--brand-2); background: var(--surface-2); border-radius: 0 10px 10px 0 }
.book .eq { background: var(--surface-2); border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0; padding: 4px 10px; margin: 10px 0; overflow-x: auto; overflow-y: hidden }
.book .katex-display { margin: 6px 0 }
.book table { font-size: 13px }
.book td, .book th { white-space: normal; text-align: left }
.book hr { border: 0; border-top: 1px solid var(--line) }
.toc { display: grid; gap: 8px }
.toc button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; cursor: pointer; display: flex; gap: 10px; align-items: center }
.toc button .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--brand-2); font-size: 13px }
.toc button.lock { opacity: .55 }
.bnav { display: flex; gap: 8px; justify-content: space-between }
.bar2 { display: grid; gap: 4px }
.syn svg { width: 100%; height: auto; display: block; border-radius: 12px }
.sec-t { font: 700 15px var(--display); margin: 4px 0 -4px; color: var(--brand-2) }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700 }
.pill.ok { background: var(--ok-bg); color: var(--ok) } .pill.ko { background: var(--ko-bg); color: var(--ko) }
@media print { .top, .strip, .nav, .noprint, #instbar { display: none !important } main { padding: 0 } .card { box-shadow: none } }
</style>

const BOOK = [{ "t": "Avant-propos", "h": "<p>Ce livre explique, étape par étape, la méthode de calcul qui se trouve dans le programme MUPGLOBAL de pompage solaire, pour qu&#39;un technicien puisse refaire chaque calcul à la main, le vérifier et l&#39;expliquer à un client.</p>\n<p>Le programme n&#39;est pas une boîte noire. Chaque feuille du classeur Excel suit un raisonnement simple : on part du besoin en eau des cultures, on en déduit le débit à pomper, puis la hauteur à vaincre, puis l&#39;énergie nécessaire, et enfin le champ photovoltaïque, les câbles, les protections, le bassin, le devis et le plan d&#39;affaires. Si le technicien comprend cette chaîne, il saura repérer une donnée fausse, corriger un résultat qui paraît anormal et défendre le dimensionnement devant le client.</p>\n<p><strong>Comment utiliser ce livre</strong></p>\n<ul>\n<li>Les chapitres 1 et 2 posent les bases : le principe d&#39;un pompage solaire au fil du soleil et les données à collecter sur le terrain.</li>\n<li>Les chapitres 3 à 8 suivent l&#39;ordre des feuilles du programme : besoins en eau, hydraulique, énergie et pompe, champ PV, câbles et protections, bassin de rétention.</li>\n<li>Les chapitres 9 et 10 couvrent la partie économique (cultures, plan d&#39;affaires, devis) et l&#39;exploitation-maintenance.</li>\n<li>Le chapitre 11 reprend un exemple complet chiffré : 1 hectare de maraîchage à Lubumbashi, avec les valeurs par défaut du programme.</li>\n<li>Le chapitre 12 propose des exercices corrigés pour former et évaluer les techniciens.</li>\n<li>Le dernier chapitre rappelle les limites de la méthode, les précautions et les sources.</li>\n</ul>\n<p><strong>Sur les sources.</strong> La méthode s&#39;appuie sur des références publiques et reconnues : la méthode FAO (bulletin FAO 56) pour l&#39;évapotranspiration et les besoins des cultures, la formule de Hazen-Williams pour les pertes de charge, les règles classiques de l&#39;électricité (chute de tension, section des câbles) et les fiches techniques des fabricants de pompes et de variateurs. Aucun ouvrage payant particulier n&#39;a servi de base. Les données climatiques par défaut sont des ordres de grandeur pour Lubumbashi : pour un vrai projet, il faut les remplacer par des données mesurées ou par celles de CLIMWAT / CROPWAT et d&#39;un outil d&#39;ensoleillement.</p>\n<p><strong>Conseil au formateur.</strong> Faites refaire à chaque technicien l&#39;exemple du chapitre 11 avec une calculatrice, puis comparez avec le programme. Un écart de plus de 5 % signale soit une erreur de saisie, soit une étape mal comprise : c&#39;est là qu&#39;il faut revenir.</p>\n" }, { "t": "Chapitre 1 – Principes du pompage solaire au fil du soleil", "h": "<p>Un pompage solaire au fil du soleil transforme directement la lumière en eau stockée : il n&#39;y a pas de batterie, c&#39;est le bassin (ou le réservoir) qui joue le rôle de stockage.</p>\n<h3>1.1 La chaîne complète</h3>\n<p>Le système dimensionné par le programme comporte six maillons :</p>\n<ol>\n<li><strong>Le soleil</strong> fournit chaque jour une quantité d&#39;énergie mesurée en heures de soleil plein (HSP, en kWh/m²/j ou h/j).</li>\n<li><strong>Les modules photovoltaïques</strong> convertissent cette énergie en courant continu. Ils sont montés en série (une chaîne, ou « string ») pour atteindre la tension d&#39;entrée du variateur.</li>\n<li><strong>Le variateur de pompage solaire</strong> (VFD solaire) reçoit le courant continu, cherche le point de puissance maximale (MPPT) et alimente le moteur en alternatif à fréquence variable. Quand le soleil baisse, la pompe tourne moins vite mais continue de débiter.</li>\n<li><strong>La motopompe immergée</strong> est descendue dans le forage, sous le niveau dynamique de l&#39;eau.</li>\n<li><strong>Le forage</strong> fournit un débit limité : on ne peut pas pomper plus que ce que la nappe donne sans dénoyer la pompe.</li>\n<li><strong>Le bassin de rétention</strong>, puis un <strong>surpresseur</strong> et le <strong>réseau d&#39;irrigation</strong> (aspersion ou goutte-à-goutte) distribuent l&#39;eau aux cultures.</li>\n</ol>\n<h3>1.2 Pourquoi pas de batterie</h3>\n<p>Une batterie coûte cher, s&#39;use en 5 à 10 ans et perd de l&#39;énergie. Stocker de l&#39;eau dans un bassin coûte beaucoup moins cher et ne s&#39;use presque pas. Le programme dimensionne donc la pompe pour remplir pendant la journée le volume dont les cultures ont besoin, et le bassin pour couvrir les jours sans soleil et l&#39;irrigation à l&#39;heure voulue.</p>\n<h3>1.3 La logique du programme en une phrase</h3>\n<blockquote>\n<p><strong>Besoin en eau (m³/j) → débit (m³/h) → hauteur manométrique totale (m) → énergie hydraulique (kWh/j) → énergie électrique → puissance crête du champ PV (Wc) → câbles et protections → bassin → coût et rentabilité.</strong></p>\n</blockquote>\n<p>Chaque flèche correspond à une formule expliquée dans les chapitres suivants. Une erreur au début (par exemple une surface ou une ETo fausse) se propage jusqu&#39;au devis : c&#39;est pourquoi le chapitre 2 insiste sur la collecte des données.</p>\n<h3>1.4 Les trois contraintes à toujours vérifier</h3>\n<ul>\n<li><strong>Le forage</strong> : le débit de pointe de la pompe ne doit pas dépasser le débit d&#39;exploitation du forage, et la pompe doit rester immergée d&#39;au moins 3 m.</li>\n<li><strong>Le variateur</strong> : la tension de la chaîne PV doit rester dans la plage MPPT à chaud et sous la tension maximale à froid.</li>\n<li><strong>Le moteur</strong> : le champ PV doit fournir assez de puissance pour démarrer et faire tourner le moteur (ratio PV / moteur d&#39;environ 1,3).</li>\n</ul>\n" }, { "t": "Chapitre 2 – Les données d'entrée (feuille « Paramètres »)", "h": "<p>La qualité du dimensionnement dépend d&#39;abord des données saisies dans la feuille Paramètres : le technicien doit les relever sur le terrain ou dans le rapport de forage, et ne jamais les inventer.</p>\n<h3>2.1 Le projet agricole</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Donnée</th>\n<th>Valeur par défaut</th>\n<th>Où la trouver</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Surface irriguée</td>\n<td>1 ha</td>\n<td>Mesure GPS ou plan du client</td>\n</tr>\n<tr>\n<td>Mode d&#39;irrigation</td>\n<td>Aspersion</td>\n<td>Choix du client : Aspersion, Goutte-à-goutte ou Mixte</td>\n</tr>\n<tr>\n<td>Efficience d&#39;irrigation</td>\n<td>0,75 (aspersion) ; 0,90 (goutte) ; 0,82 (mixte)</td>\n<td>Calculée automatiquement selon le mode</td>\n</tr>\n<tr>\n<td>Coefficient cultural Kc</td>\n<td>1</td>\n<td>FAO 56 ; 1 est une moyenne prudente en maraîchage</td>\n</tr>\n</tbody></table></div>\n<p>L&#39;<strong>efficience</strong> dit quelle part de l&#39;eau pompée est réellement utilisée par la plante. En aspersion, le vent et l&#39;évaporation en font perdre environ 25 % ; le goutte-à-goutte en perd environ 10 %.</p>\n<h3>2.2 Le climat (12 mois)</h3>\n<p>Pour chaque mois, le programme demande trois valeurs : l&#39;ensoleillement HSP (h/j), l&#39;évapotranspiration de référence ETo (mm/j) et la pluie (mm/mois). Les valeurs par défaut pour Lubumbashi sont détaillées au chapitre 3. L&#39;HSP vient d&#39;un outil d&#39;ensoleillement (par exemple PVGIS ou une base comparable) pour un plan incliné à la latitude du site ; l&#39;ETo et la pluie viennent de CLIMWAT / CROPWAT ou d&#39;une station météo proche.</p>\n<h3>2.3 Le forage</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Donnée</th>\n<th>Défaut</th>\n<th>Signification</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Niveau statique NS</td>\n<td>25 m</td>\n<td>Profondeur de l&#39;eau au repos</td>\n</tr>\n<tr>\n<td>Rabattement</td>\n<td>10 m</td>\n<td>Baisse du niveau pendant l&#39;essai de pompage</td>\n</tr>\n<tr>\n<td>Niveau dynamique ND</td>\n<td>= NS + rabattement = 35 m</td>\n<td>Niveau de l&#39;eau quand on pompe</td>\n</tr>\n<tr>\n<td>Débit d&#39;exploitation Qfor</td>\n<td>15 m³/h</td>\n<td>Débit maximal conseillé par l&#39;essai de pompage</td>\n</tr>\n<tr>\n<td>Profondeur de pose de la pompe</td>\n<td>= ND + 6 = 41 m</td>\n<td>Pompe 6 m sous le niveau dynamique</td>\n</tr>\n<tr>\n<td>Profondeur du forage</td>\n<td>= pose + 15 = 56 m</td>\n<td>Si le forage n&#39;existe pas encore</td>\n</tr>\n<tr>\n<td>Rabattement maximal admissible</td>\n<td>15 m</td>\n<td>Limite donnée par l&#39;hydrogéologue</td>\n</tr>\n</tbody></table></div>\n<p><strong>Règle d&#39;or :</strong> ces valeurs viennent de l&#39;<strong>essai de pompage</strong> du foreur. Sans essai, le dimensionnement de la pompe est un pari.</p>\n<h3>2.4 Le réseau</h3>\n<ul>\n<li>Dénivelé entre la tête de forage et le point de livraison : 3 m.</li>\n<li>Pression souhaitée au point de livraison : 2,5 bar (si pas de bassin).</li>\n<li>Longueur de conduite : 150 m ; coefficient de Hazen-Williams C = 140 (PEHD neuf).</li>\n<li>Pertes singulières (coudes, vannes, clapets) : 15 % des pertes linéaires.</li>\n<li>Vitesse maximale dans la conduite : 1,5 m/s.</li>\n<li>Bassin de rétention : Oui ; autonomie : 1 jour.</li>\n</ul>\n<h3>2.5 Les rendements et l&#39;électricité</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Paramètre</th>\n<th>Défaut</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Rendement motopompe (hydraulique)</td>\n<td>0,50</td>\n</tr>\n<tr>\n<td>Rendement variateur</td>\n<td>0,95</td>\n</tr>\n<tr>\n<td>Rendement moteur</td>\n<td>0,85</td>\n</tr>\n<tr>\n<td>Alimentation du moteur</td>\n<td>Monophasé 230 V</td>\n</tr>\n<tr>\n<td>cos φ</td>\n<td>0,82</td>\n</tr>\n<tr>\n<td>Facteur de pertes PV kPV (température, saleté, câbles)</td>\n<td>0,80</td>\n</tr>\n<tr>\n<td>Ratio puissance PV / puissance moteur</td>\n<td>1,3</td>\n</tr>\n<tr>\n<td>Marge de sécurité énergie</td>\n<td>1,1</td>\n</tr>\n<tr>\n<td>Résistivité du cuivre ρ</td>\n<td>0,0225 Ω·mm²/m</td>\n</tr>\n<tr>\n<td>Chute de tension admissible ΔU</td>\n<td>3 %</td>\n</tr>\n<tr>\n<td>Distance PV ↔ variateur</td>\n<td>20 m</td>\n</tr>\n<tr>\n<td>Distance forage ↔ variateur</td>\n<td>10 m</td>\n</tr>\n</tbody></table></div>\n<h3>2.6 Le module photovoltaïque</h3>\n<p>Le programme prend les données de la fiche technique : Pmax 550 Wc, Voc 49,6 V, Vmp 41,7 V, Isc 14 A, coefficient de température de Voc −0,27 %/°C et de Vmp −0,35 %/°C. On y ajoute la température minimale du site (5 °C) et la température de cellule en plein soleil (60 °C).</p>\n<h3>2.7 Les données économiques</h3>\n<p>Monnaie USD ; prix du gasoil 1,6 USD/L ; consommation d&#39;une motopompe diesel 0,8 L par kWh hydraulique ; entretien diesel 600 USD/an ; investissement diesel 3 000 USD ; durée de vie du groupe 5 ans. Ces valeurs servent uniquement à la comparaison solaire / diesel du plan d&#39;affaires.</p>\n<h3>2.8 Fiche de collecte terrain</h3>\n<p>Avant toute visite, le technicien imprime cette liste et la remplit sur place : coordonnées GPS, surface et cultures, mode d&#39;irrigation voulu, rapport de forage (NS, ND, débit, profondeur, diamètre du tubage), distances forage → variateur → champ PV → bassin → parcelle, dénivelés, emplacement possible du champ PV (sans ombrage) et du bassin.</p>\n" }, { "t": "Chapitre 3 – Les besoins en eau (méthode FAO)", "h": "<p>Le programme calcule mois par mois le volume d&#39;eau à pomper par jour, puis retient le mois le plus difficile, c&#39;est-à-dire celui où l&#39;on demande le plus d&#39;eau par rapport au soleil disponible.</p>\n<h3>3.1 De l&#39;évapotranspiration au besoin de la culture</h3>\n<p>L&#39;<strong>ETo</strong> est l&#39;eau qu&#39;une pelouse de référence perd par jour (évaporation du sol + transpiration des feuilles). Chaque culture consomme plus ou moins que cette référence : on multiplie par le coefficient cultural Kc.</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\">c</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\">o</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">K</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\">c</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:1em;\"></span><span class=\"mord text\"><span class=\"mord\">(mm/j)</span></span></span></span></span></span></div><h3>3.2 La pluie efficace</h3>\n<p>Toute la pluie n&#39;est pas utile : une partie ruisselle ou s&#39;infiltre trop profondément. Le programme utilise la formule simplifiée de la FAO (P = pluie du mois en mm) :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.1076em;\">f</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.1076em;\">f</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:3em;vertical-align:-1.25em;\"></span><span class=\"minner\"><span class=\"mopen delimcenter\" style=\"top:0em;\"><span class=\"delimsizing size4\">{</span></span><span class=\"mord\"><span class=\"mtable\"><span class=\"col-align-l\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.69em;\"><span style=\"top:-3.69em;\"><span class=\"pstrut\" style=\"height:3.008em;\"></span><span class=\"mord\"><span class=\"mop\">max</span><span class=\"mopen\">(</span><span class=\"mord\">0</span><span class=\"mpunct\">;</span><span class=\"mspace\"> </span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\">0</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">6</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">−</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord\">10</span><span class=\"mclose\">)</span></span></span><span style=\"top:-2.25em;\"><span class=\"pstrut\" style=\"height:3.008em;\"></span><span class=\"mord\"><span class=\"mord\">0</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">8</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">−</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord\">25</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.19em;\"><span></span></span></span></span></span><span class=\"arraycolsep\" style=\"width:1em;\"></span><span class=\"col-align-l\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.69em;\"><span style=\"top:-3.69em;\"><span class=\"pstrut\" style=\"height:3.008em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord\">si </span></span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≤</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mord\">70</span><span class=\"mord text\"><span class=\"mord\"> mm</span></span></span></span><span style=\"top:-2.25em;\"><span class=\"pstrut\" style=\"height:3.008em;\"></span><span class=\"mord\"><span class=\"mord text\"><span class=\"mord\">si </span></span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">&gt;</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mord\">70</span><span class=\"mord text\"><span class=\"mord\"> mm</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.19em;\"><span></span></span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:1em;\"></span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord text\"><span class=\"mord\">(mm/mois)</span></span></span></span></span></span></div><p>On divise ensuite par le nombre de jours du mois pour obtenir des mm/j.</p>\n<h3>3.3 Besoin net, besoin brut et volume</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0502em;\">B</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2806em;\"><span style=\"top:-2.55em;margin-left:-0.0502em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">n</span><span class=\"mord mathnormal mtight\">e</span><span class=\"mord mathnormal mtight\">t</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mop\">max</span><span class=\"mopen\">(</span><span class=\"mord\">0</span><span class=\"mpunct\">;</span><span class=\"mspace\"> </span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\">c</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">−</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span cl tre les parois du tuyau et perd de la pression. Le programme utilise la formule de Hazen-Williams, valable pour l&#39;eau froide dans les conduites courantes :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0962em;\">J</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">10</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">67</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.2604em;vertical-align:-0.7693em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.4911em;\"><span style=\"top:-2.314em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.7401em;\"><span style=\"top:-2.989em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">1</span><span class=\"mord mtight\"><span class=\"mpunct mtight\">,</span></span><span class=\"mord mtight\">852</span></span></span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">D</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.7401em;\"><span style=\"top:-2.989em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">4</span><span class=\"mord mtight\"><span class=\"mpunct mtight\">,</span></span><span class=\"mord mtight\">87</span></span></span></span></span></span></span></span></span></span></span><span style=\"top:-3.23em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"frac-line\" style=\"border-bottom-width:0.04em;\"></span></span><span style=\"top:-3.677em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord\"><span class=\"mord\"><span class=\"mord mathnormal\">Q</span><span class=\"msupsub\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8141em;\"><span style=\"top:-3.063em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mtight\">1</span><span class=\"mord mtight\"><span class=\"mpunct mtight\">,</span></span><span class=\"mord mtight\">852</span></span></span></span></span></span></span></span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.7693em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">×</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\">L</span><span class=\"mspace\" style=\"margin-right:1em;\"></span><span class=\"mopen\">(</span><span class=\"mord mathnormal\">Q</span><span class=\"mord text\"><span class=\"mord\"> en m³/s</span></span><span class=\"mpunct\">,</span><span class=\"mspace\"> </span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">D</span><span class=\"mord text\"><span class=\"mord\"> et </span></span><span class=\"mord mathnormal\">L</span><span class=\"mord text\"><span class=\"mord\"> en m</span></span><span class=\"mclose\">)</span></span></span></span></span></div><ul>\n<li><strong>C</strong> = 140 pour du PEHD ou du PVC neuf (120 pour de l&#39;acier galvanisé neuf, 100 pour de l&#39;acier ancien).</li>\n<li><strong>L</strong> = longueur parcourue par l&#39;eau. Avec bassin : distance forage → bassin (50 m) + profondeur de pose (41 m) = <strong>91 m</strong>. Sans bassin : longueur de la conduite d&#39;irrigation (150 m) + profondeur de pose.</li>\n</ul>\n<p>Résultat : J = 2,17 m de pertes linéaires. Les <strong>pertes singulières</strong> (coudes, clapet, vannes, compteur) sont prises à 15 % : 0,33 m.</p>\n<h3>4.4 La hauteur géométrique</h3>\n<p>C&#39;est la différence de niveau entre la surface de l&#39;eau dans le forage (en pompage) et le point le plus haut de livraison :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0813em;\">H</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.0813em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord accent mtight\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"mord mathnormal mtight\">e</span></span><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"accent-body\" style=\"left:-0.1944em;\"><span class=\"mord mtight\">ˊ</span></span></span></span></span></span></span><span class=\"mord mathnormal mtight\">o</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7667em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.109em;\">N</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">D</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord\">Δ</span><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">Z</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">35</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">5</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">36</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">5</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">m</span></span></span></span></span></span></div><p>Avec bassin, ΔZ est le dénivelé forage → bassin (1,5 m) ; sans bassin, c&#39;est le dénivelé vers la parcelle (3 m).</p>\n<h3>4.5 La pression de sortie</h3>\n<ul>\n<li>Avec bassin : on prévoit seulement <strong>1 m</strong> de charge pour que l&#39;eau tombe dans le bassin.</li>\n<li>Sans bassin : la pression demandée par les asperseurs, convertie en mètres : 1 bar ≈ 10,2 m, donc 2,5 bar = 25,5 m.</li>\n</ul>\n<h3>4.6 La HMT</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord mathnormal\" style=\"margin-right:0.0813em;\">H</span><span class=\"mord mathnormal\" style=\"margin-right:0.109em;\">M</span><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">T</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0813em;\">H</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.0813em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord accent mtight\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"mord mathnormal mtight\">e</span></span><span style=\"top:-2.7em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"accent-body\" style=\"left:-0.1944em;\"><span class=\"mord mtight\">ˊ</span></span></span></span></span></span></span><span class=\"mord mathnormal mtight\">o</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0962em;\">J</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.0962em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal mtight\">in</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0962em;\">J</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3117em;\"><span style=\"top:-2.55em;margin-left:-0.0962em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">s</span><span class=\"mord mathnormal mtight\">in</span><span class=\"mord mathnormal mtight\" style=\"margin-right:0.0359em;\">g</span></span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.2861em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.9694em;vertical-align:-0.2861em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0813em;\">H</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3117em;\"><span style=\"top:-2.55em;margin-left:-0.0813em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">p</span><span class=\"mord mathnormal mtight\" style=\"m span class=\"mord\">ˊ</span></span></span></span></span></span></span><span class=\"mord\">e)</span></span></span></span></span></span></div><h3>5.3 La puissance normalisée du moteur</h3>\n<p>La plaque d&#39;un moteur indique sa puissance mécanique à l&#39;arbre (P2). Elle vaut la puissance absorbée multipliée par le rendement du moteur :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3011em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\">2</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">≥</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.3361em;\"><span style=\"top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mtight\"><span class=\"mord mathnormal mtight\">ab</span><span class=\"mord mathnormal mtight\">s</span></span></span></span></span><span class=\" ss=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord\">2</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\">724</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">W</span></span></span></span></span></span></div><p>Le programme prend dans le catalogue la puissance normalisée immédiatement supérieure : <strong>3 kW</strong>. Les puissances courantes sont 0,37 – 0,55 – 0,75 – 1,1 – 1,5 – 2,2 – 3 – 4 – 5,5 – 7,5 – 11 – 15 kW.</p>\n<h3>5.4 Le diamètre de la pompe</h3>\n<ul>\n<li>Débit de pointe ≤ 8 m³/h : pompe <strong>4 pouces</strong> (forage tubé en 5″ ou plus).</li>\n<li>Débit de pointe &gt; 8 m³/h : pompe <strong>6 pouces</strong> (forage tubé en 7″ ou plus).</li>\n</ul>\n<p>Ici, Qp = 14,7 m³/h : <strong>motopompe immergée solaire 6 pouces, moteur 3 kW, monophasé 230 V.</strong> Le technicien doit vérifier que le tubage du forage accepte ce diamètre.</p>\n<h3>5.5 Le choix final sur la courbe du fabricant</h3>\n<p>Le programme donne le <strong>point de fonctionnement</strong> à demander au fournisseur : <strong>14,7 m³/h à 40 m de HMT</strong>. Sur la courbe (débit en abscisse, hauteur en ordonnée), on choisit le modèle dont la courbe passe juste au-dessus de ce point, dans la zone de bon rendement (au milieu de la courbe, pas en bout). Si le fabricant propose un logiciel de sélection (Lorentz Compass, Grundfos Product Center, etc.), on peut y saisir les mêmes données pour comparer.</p>\n<h3>5.6 Le variateur</h3>\n<p>Le variateur solaire est choisi de la même puissance que le moteur et de la même sortie (ici 3 kW, sortie monophasée 230 V, entrée DC avec MPPT). En monophasé, on ne dépasse pas 2,2 à 3 kW selon les modèles : au-delà, on passe en triphasé.</p>\n<h3>5.7 L&#39;énergie électrique journalière</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span clas <table>\n<thead>\n<tr>\n<th>Résultat</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Modules</td>\n<td>8 × 550 Wc</td>\n</tr>\n<tr>\n<td>Puissance installée</td>\n<td>4 400 Wc</td>\n</tr>\n<tr>\n<td>Chaînes en parallèle</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Vmp de la chaîne à chaud</td>\n<td>292,7 V (dans 200–400 V : OK)</td>\n</tr>\n<tr>\n<td>Voc de la chaîne à froid</td>\n<td>418,2 V (&lt; 450 V : OK)</td>\n</tr>\n<tr>\n<td>Surface au sol des modules</td>\n<td>environ 20,8 m²</td>\n</tr>\n</tbody></table></div>\n<p>Si le nombre de modules nécessaire dépasse Ns max, le programme crée plusieurs chaînes identiques en parallèle. Toutes les chaînes doivent avoir le <strong>même nombre de modules</strong> et la même orientation.</p>\n<h3>6.7 Installation du champ</h3>\n<ul>\n<li>Orientation plein nord (hémisphère sud, cas de Lubumbashi), inclinaison proche de la latitude (environ 12° ; au moins 10° pour que la pluie nettoie les modules).</li>\n<li>Aucun ombrage entre 8 h et 16 h : arbres, bâtiments, château d&#39;eau.</li>\n<li>Champ le plus près possible du variateur (ici 20 m) pour limiter les pertes DC.</li>\n<li>Structure ancrée et reliée à la terre ; clôture contre le vol.</li>\n</ul>\n<h3>6.8 Si le technicien change de module</h3>\n<p>Il suffit de saisir la nouvelle fiche technique dans Paramètres : le programme recalcule Ns min, Ns max et le nombre de modules. Un module de 450 Wc avec Voc 41 V permettra par exemple jusqu&#39;à 10 modules en série ; il faut toujours relire les deux vérifications de tension.</p>\n" }, { "t": "Chapitre 7 – Câbles, protections et sécurité du forage", "h": "<p>Les câbles sont choisis pour limiter la chute de tension à 3 %, et les protections pour protéger le moteur, le variateur et les personnes ; le programme termine par la vérification du forage.</p>\n<h3>7.1 Le courant du moteur</h3>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><spa style=\"margin-right:0.2222em;\"></span><span class=\"mord\">17</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">5</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.8804em;\"><span></span></span></span></span></span><span class=\"mclose nulldelimiter\"></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.8389em;vertical-align:-0.1944em;\"></span><span class=\"mord\">1</span><span class=\"mord\"><span class=\"mpunct\">,</span></span><span class=\"mord\">8</span><span class=\"mspace\"> </span><span class=\"mord text\"><span class=\"mord\">mm²</span></span></span></span></span></span></div><p>Le programme impose un minimum de <strong>4 mm²</strong> en câble solaire <strong>H1Z2Z2-K</strong> (résistant aux UV, double isolation), avec connecteurs MC4 de la même marque des deux côtés.</p>\n<h3>7.4 Les protections</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Protection</th>\n<th>Règle du programme</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Disjoncteur moteur (côté AC)</td>\n<td>Calibre normalisé ≥ 1,25 × I moteur</td>\n<td>25 A</td>\n</tr>\n<tr>\n<td>Interrupteur-sectionneur DC</td>\n<td>Entre champ et variateur, tension ≥ Voc chaîne</td>\n<td>≥ 500 V DC</td>\n</tr>\n<tr>\n<td>Parafoudre DC</td>\n<td>Ucpv normalisée ≥ 1,2 × Voc chaîne à froid (1,2 × 418 = 502 V)</td>\n<td>600 V</td>\n</tr>\n<tr>\n<td>Fusibles gPV</td>\n<td>Seulement à partir de 3 chaînes en parallèle (2 par chaîne)</td>\n<td>Non requis</td>\n</tr>\n<tr>\n<td>Protection marche à sec</td>\n<td>Sonde ou électrodes de niveau dans le forage, reliées au variateur</td>\n<td>Obligatoire</td>\n</tr>\n<tr>\n<td>Flotteur de bassin plein</td>\n<td>Arrête la pompe quand le bassin est plein</td>\n<td>Conseillé</td>\n</tr>\n<tr>\n<td>Mise à la terre</td>\n<td>Structure PV, variateur, parafoudre reliés à un piquet de terre</td>\n<td>Obligatoire</td>\n</tr>\n</tbody></table></div>\n<p>Pourquoi pas de fusible avec une ou deux chaînes ? Le courant inverse maximal qu&#39;une chaîne peut recevoir des autres ne dépasse pas la tenue des modules. À partir de trois chaînes, deux chaînes saines peuvent débiter dans une chaîne en défaut : les fusibles gPV deviennent nécessaires.</p>\n<h3>7.5 La vérification du forage</h3>\n<p>Le programme vérifie que la pompe ne dénoie pas et ne s&#39;ensable pas. Le <strong>débit spécifique</strong> est tiré de l&#39;essai de pompage :</p>\n<div class=\"eq\"><span class=\"katex-display\"><span class=\"katex\"><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">q</span><span class=\"msupsub\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.1514em;\"><span style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\"><span class=\"pstrut\" style=\"height:2.7em;\"></span><span class=\"sizing reset-size6 size3 mtight\"><span class=\"mord mathnormal mtight\">s</span></span></span></span><span class=\"vlist-s\">​</span></span><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.15em;\"><span></span></span></span></span></span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:2.0463em;vertical-align:-0.686em;\"></span><span class=\"mord\"><span class=\"mopen nulldelimiter\"></span><span class=\"mfrac\"><span class=\"vlist-t vlist-t2\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:1.3603em;\"><span style=\"top:-2.314em;\"><
